services:
  imgw-merge-weather:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: imgw-merge-weather:local
    container_name: imgw-merge-weather
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      IMGW_DATA_DIR: /data
      IMGW_STATIC_DIR: /app/static
      IMGW_LOG_LEVEL: ${IMGW_LOG_LEVEL:-info}
      IMGW_VIDEO_FPS: ${IMGW_VIDEO_FPS:-5}
      IMGW_VIDEO_CODEC: ${IMGW_VIDEO_CODEC:-libx264}
      IMGW_VIDEO_CRF: ${IMGW_VIDEO_CRF:-20}
      IMGW_VIDEO_PRESET: ${IMGW_VIDEO_PRESET:-medium}
      IMGW_SCHEDULER_ENABLED: ${IMGW_SCHEDULER_ENABLED:-false}
      IMGW_SCHEDULER_CRON: ${IMGW_SCHEDULER_CRON:-2 * * * *}
      IMGW_SCHEDULER_MISFIRE_GRACE_SECONDS: ${IMGW_SCHEDULER_MISFIRE_GRACE_SECONDS:-60}
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
