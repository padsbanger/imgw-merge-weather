[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imgw-merge-weather"
version = "0.1.0"
description = "Self-hosted IMGW CMM MERGE precipitation forecast viewer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pillow>=11.3,<13.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "respx>=0.22,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
